name: Update wallpaper gallery

on:
  push:
    branches:
      - main
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.webp"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpaper-gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-gallery.txt

      - name: Install gallery dependencies
        run: python -m pip install --requirement requirements-gallery.txt

      - name: Generate gallery
        run: python scripts/generate_gallery.py

      - name: Commit generated gallery
        run: |
          git add README.md .gallery-manifest.json thumbnails
          if git diff --cached --quiet; then
            echo "Gallery is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update wallpaper gallery"
          git push
